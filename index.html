
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AYKA AI</title>
<style>
body {
 margin:0;
 background:#10131b;
 color:white;
 font-family:Arial;
}
header {
 padding:18px;
 text-align:center;
 background:#191f2c;
 color:#54c8ff;
}
#chat {
 height:65vh;
 overflow:auto;
 padding:12px;
}
.message {
 padding:12px;
 margin:10px 0;
 border-radius:14px;
 max-width:85%;
 overflow-wrap:anywhere;
}
.user {background:#245d91;margin-left:auto}
.bot {background:#252d3b}
footer {
 display:flex;
 gap:7px;
 padding:12px;
}
input {
 flex:1;
 min-width:0;
 padding:13px;
 border:0;
 border-radius:12px;
}
button {
 background:#168ed0;
 color:white;
 border:0;
 border-radius:12px;
 padding:12px;
}
#memory {
 padding:10px;
 color:#9eb3c9;
 font-size:13px;
}
</style>
</head>
<body>

<header>
<h2>🤖 AYKA AI</h2>
<p>Sənin şəxsi süni intellekt köməkçin</p>
</header>

<div id="memory">🧠 Yaddaş hazırlanır...</div>
<div id="chat"></div>

<footer>
<input id="msg" placeholder="AYKA-ya yaz...">
<button onclick="send()">➤</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("msg");

let history = JSON.parse(
 localStorage.getItem("ayka_history") || "[]"
);

let memory = JSON.parse(
 localStorage.getItem("ayka_memory") || "[]"
);

function save() {
 localStorage.setItem(
  "ayka_history", JSON.stringify(history)
 );
 localStorage.setItem(
  "ayka_memory", JSON.stringify(memory)
 );
}

function show(who,text) {
 let d = document.createElement("div");
 d.className = "message " + who;
 d.textContent = text;
 chat.appendChild(d);
 chat.scrollTop = chat.scrollHeight;
}

function reply(t) {
 let q = t.toLowerCase();

 if(q.startsWith("yadda saxla:")) {
  let fact = t.substring(t.indexOf(":")+1).trim();
  if(!fact) return "Yadda saxlanacaq məlumat yaz.";
  memory.push(fact);
  save();
  updateMemory();
  return "Bunu yaddaşıma yazdım: " + fact;
 }

 if(q === "yaddaşım") {
  return memory.length
   ? "Yaddaşımda olanlar:\n" + memory.map((x,i)=>(i+1)+". "+x).join("\n")
   : "Hələ yaddaşımda məlumat yoxdur.";
 }

 if(q === "köhnə söhbətlər") {
  return history.length
   ? "Əvvəlki söhbətlərimiz:\n" +
     history.slice(-10).map(x=>"Sən: "+x.user+"\nMən: "+x.bot).join("\n\n")
   : "Hələ söhbət tarixçəm yoxdur.";
 }

 if(q.includes("salam"))
  return "Salam! Mən AYKA AI-yam. Necəsən?";

 if(q.includes("adın nədir"))
  return "Mənim adım AYKA AI-dır!";

 if(q.includes("necəsən"))
  return "Yaxşıyam! Sən necəsən?";

 if(q.includes("saat"))
  return "Saat: "+new Date().toLocaleTimeString("az-AZ");

 if(q.includes("məni tanıyırsan") || q.includes("məni xatırlayırsan"))
  return memory.length
   ? "Bəli! Yaddaşımda bunlar var:\n"+memory.join("\n")
   : "Hələ səni tanımaq üçün məlumatım yoxdur.";

 return "Bu suala hələ cavab verməyi öyrənməmişəm. Amma söhbətlərimizi yadda saxlayıram!";
}

function updateMemory() {
 document.getElementById("memory").textContent =
 "🧠 Yaddaş: "+memory.length+" məlumat saxlanılıb";
}

function send() {
 let t = input.value.trim();
 if(!t) return;

 show("user",t);
 let a = reply(t);
 show("bot",a);

 history.push({user:t,bot:a});
 save();
 updateMemory();
 input.value="";
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter") send();
});

history.forEach(x=>{
 show("user",x.user);
 show("bot",x.bot);
});

updateMemory();

if(history.length===0)
 show("bot","Salam! Mən AYKA AI-yam. Söhbətimiz yadda qalacaq!");
</script>

</body>
  </html>
