
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport"content="width=device-width, initial-scale=1">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#10131c">
 <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#10131c">
<title>AYKA AI</title>
 <title>AYKA AI</title>

<style>
* { box-sizing: border-box; }

body {
 margin: 0;
 background: #10131b;
 color: white;
 font-family: Arial, sans-serif;
}

header {
 padding: 20px;
 text-align: center;
 background: #191f2c;
 color: #54c8ff;
}

#memory {
 padding: 12px;
 color: #9eb3c9;
 font-size: 14px;
}

#chat {
 height: 65vh;
 overflow-y: auto;
 padding: 12px;
}

.message {
 padding: 13px;
 margin: 10px 0;
 border-radius: 15px;
 max-width: 88%;
 white-space: pre-wrap;
 overflow-wrap: anywhere;
}

.user {
 background: #245d91;
 margin-left: auto;
}

.bot {
 background: #252d3b;
}

footer {
 display: flex;
 gap: 8px;
 padding: 12px;
}

input {
 flex: 1;
 min-width: 0;
 padding: 14px;
 border: 0;
 border-radius: 12px;
 font-size: 16px;
}

button {
 background: #168ed0;
 color: white;
 border: 0;
 border-radius: 12px;
 padding: 14px;
 font-size: 18px;
}
</style>
</head>

<body>

<header>
<h2>🤖 AYKA AI</h2>
<p>Sənin şəxsi süni intellekt köməkçin</p>
</header>

<div id="memory">🧠 Yaddaş hazırlanır...</div>
<div id="chat"></div>

<footer>
<input id="msg" placeholder="AYKA-ya yaz...">
<button onclick="send()">➤</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("msg");

let history = JSON.parse(
 localStorage.getItem("ayka_history") || "[]"
);

let memory = JSON.parse(
 localStorage.getItem("ayka_memory") || "[]"
);

function normalize(text) {
 return text.toLowerCase()
 .replaceAll("ə","e")
 .replaceAll("ı","i")
 .trim();
}

function save() {
 localStorage.setItem(
  "ayka_history", JSON.stringify(history)
 );

 localStorage.setItem(
  "ayka_memory", JSON.stringify(memory)
 );
}

function show(who, text) {
 let d = document.createElement("div");
 d.className = "message " + who;
 d.textContent = text;
 chat.appendChild(d);
 chat.scrollTop = chat.scrollHeight;
}

function updateMemory() {
 document.getElementById("memory").textContent =
 "🧠 Yaddaş: " + memory.length +
 " məlumat saxlanılıb";
}

function reply(t) {
 let q = normalize(t);

 // YADDAŞA MƏLUMAT ƏLAVƏ ET
 if(q.startsWith("yadda saxla:") ||
    q.startsWith("yadda saxla ")) {

  let fact = t.substring(
   t.indexOf("yadda") + 11
  ).replace(/^:\s*/, "").trim();

  if(!fact) return "Nəyi yadda saxlayım?";

  memory.push(fact);
  save();
  updateMemory();

  return "Bunu yaddaşıma yazdım: " + fact;
 }

 // YADDAŞI GÖSTƏR
 if(q.includes("yaddasim") ||
    q.includes("yaddasimi")) {

  if(memory.length === 0)
   return "Hələ yaddaşımda məlumat yoxdur.";

  return "Yaddaşımda olan məlumatlar:\n" +
   memory.map((x,i)=>(i+1)+". "+x).join("\n");
 }

 // KÖHNƏ SÖHBƏTLƏR
 if(q.includes("kohne sohbet")) {

  if(history.length === 0)
   return "Hələ söhbət tarixçəm yoxdur.";

  return history.slice(-10)
   .map(x=>"Sən: "+x.user+"\nAYKA: "+x.bot)
   .join("\n\n");
 }

 // YADDAŞDAN MƏLUMAT SİL
 if(q.startsWith("yaddasdan sil")) {
  let value = t.substring(t.indexOf("sil")+3).trim();

  let before = memory.length;

  memory = memory.filter(
   x => normalize(x) !== normalize(value)
  );

  save();
  updateMemory();

  return before === memory.length
   ? "Bu məlumat yaddaşımda tapılmadı."
   : "Məlumat yaddaşımdan silindi.";
 }

 // SALAMLAŞMA
 if(q.includes("salam"))
  return "Salam! Mən AYKA AI-yam. Necəsən?";

 if(q.includes("adin nedir"))
  return "Mənim adım AYKA AI-dır!";

 if(q.includes("necəsən") || q.includes("necesen"))
  return "Yaxşıyam! Sən necəsən?";

 if(q.includes("saat"))
  return "İndiki saat: " +
   new Date().toLocaleTimeString("az-AZ");

 if(q.includes("meni taniyirsan") ||
    q.includes("meni xatirlayirsan"))
  return memory.length
   ? "Bəli! Yaddaşımda bunlar var:\n"+memory.join("\n")
   : "Hələ səni tanımaq üçün məlumatım yoxdur.";

 return "Bu suala hələ cavab verməyi öyrənməmişəm. Amma söhbətimizi yadda saxlayıram!";
}

function send() {
 let t = input.value.trim();
 if(!t) return;

 show("user", t);

 let a = reply(t);

 show("bot", a);

 history.push({
  user: t,
  bot: a
 });

 save();
 updateMemory();

 input.value = "";
}

input.addEventListener("keydown", e => {
 if(e.key === "Enter") send();
});

history.forEach(x => {
 show("user", x.user);
 show("bot", x.bot);
});

updateMemory();

if(history.length === 0) {
 show("bot",
  "Salam! Mən AYKA AI-yam. Söhbətimiz yadda qalacaq!"
 );
}
</script>

</body>
</html>
